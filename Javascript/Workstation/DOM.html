<!DOCTYPE html>
<html>
<head>
    <title>Amazon.in - Shopping</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        header {
            background-color: #131921;
            color: white;
            padding: 20px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px;
            width: 250px;
        }

        .price {
            font-weight: bold;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <header id="header">

        <h1 id="logo">Amazon.in</h1>

    </header>

    <main>

        <h2 id="pageTitle">Today's Deals</h2>

        <div class="product">

            <h3 class="productName">
                Wireless Headphones
            </h3>

            <p class="price">₹1,499</p>

        </div>

        <div class="product">

            <h3 class="productName">
                Wireless Keyboard
            </h3>

            <p class="price">₹899</p>

        </div>

        <div class="product">

            <h3 class="productName">
                USB Mouse
            </h3>

            <p class="price">₹499</p>

        </div>

    </main>

</body>
</html>
